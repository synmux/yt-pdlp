# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    # Trunk plugins v1.11.0 still pass pinact the single-dash `-format` flag, which pinact 5 rejects.
    - pinact
    - black # ruff-format is the formatter of record (pyproject line-length 100)
    - isort
  enabled:
    - actionlint@1.7.12
    - hadolint@2.15.1
    - checkov@3.4.0
    - yamllint@1.38.0
    - bandit@1.9.4
    - git-diff-check
    - markdownlint@0.50.0
    - prettier@3.9.10
    - ruff@0.17.3
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.99.7
  ignore:
    - linters:
        - prettier
      paths:
        - .github/workflows/claude*.yml
    - linters:
        - bandit
      paths:
        - tests/**
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
