version: 2
updates:
  # Configuration for pip
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    assignees:
      - synmux
  # Configuration for docker
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    assignees:
      - synmux
  # Configuration for github-actions
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    assignees:
      - synmux
